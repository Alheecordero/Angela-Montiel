<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Error del servidor | Ángela Montiel</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: #fff; color: #1f2e3a; font-family: system-ui, sans-serif; }
        main { max-width: 34rem; }
        p.k { margin: 0 0 1rem; color: #76603f; font-size: .72rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
        h1 { margin: 0 0 1rem; font-family: Georgia, serif; font-weight: 500; font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: 1.1; }
        a { display: inline-block; margin-top: 1.2rem; padding: .8rem 1.4rem; border-radius: 999px; background: #1f2e3a; color: #f6f1e8; text-decoration: none; }
        a:focus-visible { outline: 2px solid #1f2e3a; outline-offset: 3px; }
    </style>
</head>
<body>
    {# Plantilla autónoma: si el servidor falla, no depende de la base de datos ni de otras plantillas. #}
    <main>
        <p class="k">Error 500</p>
        <h1>Algo falló de nuestro lado.</h1>
        <p>Intenta de nuevo en unos minutos.</p>
        <a href="/">Volver al inicio</a>
    </main>
</body>
</html>
