{% extends "base.html" %}

{% block content %}
<section class="c-hero">
    <div class="container reveal">
        <p class="firm-kicker">Boletín</p>
        <h1>Baja confirmada.</h1>
        <div class="c-hero-rule" aria-hidden="true"></div>
        <p class="c-hero-lead">El correo <strong>{{ subscriber.email }}</strong> ya no recibirá el boletín. Puedes volver a suscribirte cuando quieras desde la página de publicaciones.</p>
        <div class="c-hero-actions">
            <a href="{% url 'core:home' %}" class="btn-ink"><span>Volver al inicio</span></a>
        </div>
    </div>
</section>
{% endblock %}
