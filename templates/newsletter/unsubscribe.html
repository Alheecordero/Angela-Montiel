{% extends "base.html" %}

{% block title %}Baja de newsletter — {{ site_settings.site_name }}{% endblock %}

{% block content %}
<section class="section">
    <div class="container confirmation-card reveal">
        <h1>Baja confirmada</h1>
        <p>
            El correo <strong>{{ subscriber.email }}</strong> ha sido dado de baja del newsletter.
        </p>
        <a href="{% url 'core:home' %}" class="btn btn-blue">Volver al inicio</a>
    </div>
</section>
{% endblock %}
