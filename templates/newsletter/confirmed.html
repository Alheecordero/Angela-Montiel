{% extends "base.html" %}

{% block content %}
<section class="c-hero">
    <div class="container reveal">
        <p class="firm-kicker">Boletín</p>
        <h1>Suscripción confirmada.</h1>
        <div class="c-hero-rule" aria-hidden="true"></div>
        <p class="c-hero-lead">Gracias. El correo <strong>{{ subscriber.email }}</strong> recibirá cada nota jurídica cuando cambie algo que afecte a tu empresa.</p>
        <div class="c-hero-actions">
            <a href="{% url 'publications:list' %}" class="btn-ink"><span>Ir a las publicaciones</span></a>
            <a href="{% url 'core:home' %}" class="firm-text-link"><span>Volver al inicio</span></a>
        </div>
    </div>
</section>
{% endblock %}
