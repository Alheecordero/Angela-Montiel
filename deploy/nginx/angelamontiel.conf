# Ángela Montiel — Django/Gunicorn
# Dominio canónico. https://angelamontiel.cl (apex). www redirige a apex.
# Las URL públicas no llevan barra final; Django emite las 301 necesarias.
#
# Lanzamiento. Cuando el sitio pase a indexable (SITE_INDEXABLE=True en .env)
# hay que QUITAR la cabecera X-Robots-Tag de este archivo y recargar nginx.

limit_req_zone $binary_remote_addr zone=am_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=am_static:10m rate=40r/s;
limit_conn_zone $binary_remote_addr zone=am_addr:10m;

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name angelamontiel.cl www.angelamontiel.cl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/angelamontiel/public;
        allow all;
    }

    location / {
        return 301 https://angelamontiel.cl$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.angelamontiel.cl;

    ssl_certificate /etc/letsencrypt/live/angelamontiel.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/angelamontiel.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://angelamontiel.cl$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name angelamontiel.cl;

    ssl_certificate /etc/letsencrypt/live/angelamontiel.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/angelamontiel.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;
    limit_conn am_addr 20;
    # Solo mientras el sitio esté en pruebas. Eliminar al lanzar.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/angelamontiel/public;
        allow all;
    }

    location ~ ^/(robots\.txt|llms\.txt|sitemap\.xml)$ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://unix:/run/gunicorn-angelamontiel.sock;
        access_log off;
    }

    location /static/ {
        alias /var/www/angelamontiel/staticfiles/;
        limit_req zone=am_static burst=60 nodelay;
        expires 30d;
        add_header Cache-Control "public, immutable";
        types {
            image/avif avif;
            image/webp webp;
        }
        include /etc/nginx/mime.types;
    }

    location /media/ {
        alias /var/www/angelamontiel/media/;
        limit_req zone=am_static burst=30 nodelay;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        limit_req zone=am_general burst=30 nodelay;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_pass http://unix:/run/gunicorn-angelamontiel.sock;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }
}
